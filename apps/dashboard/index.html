<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Jarvis Unified — Status</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #e8eefc; }
    main { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .sub { color: #9bb0d0; margin-bottom: 1.5rem; }
    .card { background: #141b2f; border: 1px solid #243056; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.35rem 0; border-bottom: 1px solid #1c2644; }
    .row:last-child { border-bottom: 0; }
    .label { color: #9bb0d0; }
    .ok { color: #5ddea6; }
    .warn { color: #f0c14a; }
    .err { color: #ff7b7b; }
    button { background: #2a3c5a; color: #e8eefc; border: 1px solid #3a4f7a; border-radius: 8px; padding: 0.5rem 0.9rem; cursor: pointer; }
    button:hover { background: #354e78; }
    code { font-size: 0.85rem; color: #b7c8e8; }
    @media (max-width: 520px) {
      main { margin: 1.25rem auto; }
      .card { padding: 0.85rem; }
      .row { align-items: flex-start; }
      .row code { overflow-wrap: anywhere; text-align: right; }
      button { min-height: 44px; width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Jarvis Unified</h1>
    <p class="sub">Read-only status dashboard · paper-first · localhost API</p>

    <div class="card">
      <div class="row"><span class="label">API base</span><code id="apiBase">http://127.0.0.1:8787</code></div>
      <div class="row"><span class="label">Health</span><span id="health">—</span></div>
      <div class="row"><span class="label">Mode</span><span id="mode">—</span></div>
      <div class="row"><span class="label">Broker</span><span id="broker">—</span></div>
      <div class="row"><span class="label">Kill switch</span><span id="kill">—</span></div>
      <div class="row"><span class="label">Balance</span><span id="balance">—</span></div>
      <div class="row"><span class="label">Equity</span><span id="equity">—</span></div>
      <div class="row"><span class="label">Open positions</span><span id="positions">—</span></div>
      <div class="row"><span class="label">Last updated</span><span id="updated">never</span></div>
    </div>

    <button id="refresh" type="button">Refresh</button>
    <p class="sub" style="margin-top:1rem">Start with <code>python main.py --serve</code>. This page never places orders.</p>
  </main>
  <script>
    const base = window.location.origin;
    document.getElementById('apiBase').textContent = base;

    const FIELDS = ['mode', 'broker', 'kill', 'balance', 'equity', 'positions'];

    // Never leave values from an earlier successful poll on screen once the API stops
    // answering: a stale balance or kill-switch state on a status page is misleading.
    function clearStatus() {
      for (const id of FIELDS) {
        const el = document.getElementById(id);
        el.textContent = '—';
        el.className = '';
      }
    }

    async function load() {
      const healthEl = document.getElementById('health');
      try {
        const healthResponse = await fetch(base + '/health', { cache: 'no-store' });
        if (!healthResponse.ok) throw new Error('Health request failed');
        const h = await healthResponse.json();
        healthEl.textContent = h.ok ? 'ok' : 'degraded';
        healthEl.className = h.ok ? 'ok' : 'warn';
      } catch {
        healthEl.textContent = 'unavailable';
        healthEl.className = 'err';
        clearStatus();
        return;
      }
      try {
        const statusResponse = await fetch(base + '/status', { cache: 'no-store' });
        if (!statusResponse.ok) throw new Error('Status request failed');
        const s = await statusResponse.json();
        document.getElementById('mode').textContent = s.mode || '—';
        document.getElementById('broker').textContent = s.broker || '—';
        const kill = document.getElementById('kill');
        if (typeof s.kill_switch === 'boolean') {
          kill.textContent = s.kill_switch ? 'engaged' : 'released';
          kill.className = s.kill_switch ? 'warn' : 'ok';
        } else {
          kill.textContent = '—';
          kill.className = '';
        }
        const acct = s.account || {};
        document.getElementById('balance').textContent = acct.balance ?? '—';
        document.getElementById('equity').textContent = acct.equity ?? '—';
        document.getElementById('positions').textContent = Array.isArray(s.positions) ? s.positions.length : '—';
        document.getElementById('updated').textContent = new Date().toLocaleTimeString();
      } catch {
        clearStatus();
        document.getElementById('mode').textContent = 'unavailable';
        document.getElementById('mode').className = 'err';
      }
    }
    document.getElementById('refresh').addEventListener('click', load);
    load();
    setInterval(load, 5000);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
