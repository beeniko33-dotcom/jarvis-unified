name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pytest suite
        run: pytest -q
      - name: Validate paper-mode startup
        run: python main.py --check
      - name: Check runtime report payload
        run: python main.py --report >/tmp/jarvis-report.json && python - <<'PY'
import json
from pathlib import Path
payload = json.loads(Path('/tmp/jarvis-report.json').read_text())
assert payload['ok'] is True
assert payload['mode'] == 'paper'
assert payload['broker'] == 'paper'
print('report ok')
PY
      - name: Run foundation diagnostic
        run: python scripts/diagnose.py
