name: CI

on:
  push:
    branches: [main, feat/jarvis-forex-signal-only, feat/gateio-readonly-market-provider, deriv-eurusd-readonly-feed, level3-provenance-ops-readiness, feat/deriv-tls-claim-fail-closed, fix/forward-evidence-verifier-injection-closed]
  pull_request:
    branches: [main, deriv-eurusd-readonly-feed, level3-provenance-ops-readiness, feat/deriv-tls-claim-fail-closed, feat/public-rss-metadata-ingestion, feat/research-source-health-gaps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned test and market-data dependencies
        run: |
          python -m pip install "pip==26.3"
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Verify public portal product boundaries
        run: python scripts/check_portal_boundaries.py

      - name: Run forecast-only engine tests
        run: python -m unittest tests.test_forex_forecast -v

      - name: Run remaining repository regression suite
        run: python -m unittest discover -s tests -v

      - name: Test JAEO supervised operations policy
        run: python -m unittest discover -s tests -p 'test_jaeo_policy.py' -v

      - name: Test Deriv read-only market-data collector
        run: python -m unittest discover -s tests -p 'test_deriv_feed.py' -v

      - name: Syntax-check manual QA browser runner
        run: python -m py_compile scripts/qa_browser_e2e.py

      - name: Run foundation diagnostic
        run: python scripts/diagnose.py

      - name: Build and smoke-test the local container
        run: |
          docker compose up -d --build --wait
          docker compose exec -T jarvis python -c "import json, urllib.request; base='http://127.0.0.1:8787'; assert json.loads(urllib.request.urlopen(base+'/health').read())['ok']; features=json.loads(urllib.request.urlopen(base+'/features').read()); assert features['read_only']; dashboard=urllib.request.urlopen(base+'/dashboard'); assert dashboard.status==200 and dashboard.read(); print('container health, feature inventory, and dashboard ok')"

      - name: Stop the local container
        if: always()
        run: docker compose down

  browser-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JARVIS_SUPABASE_URL: ${{ secrets.JARVIS_SUPABASE_URL }}
      JARVIS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JARVIS_SUPABASE_SERVICE_ROLE_KEY }}
      JARVIS_E2E_PORTAL_URL: https://jarvis-unified-portal.pages.dev
      JARVIS_E2E_CONTROL_URL: https://jarvis-control-panel.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned Playwright browser runner
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.65.2"
          python -m playwright install --with-deps chromium

      - name: Run authenticated isolated QA browser journeys
        run: python scripts/qa_browser_e2e.py
