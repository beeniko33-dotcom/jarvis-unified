name: CI

on:
  push:
    branches: [main, deriv-eurusd-readonly-feed, level3-provenance-ops-readiness, feat/deriv-tls-claim-fail-closed, fix/forward-evidence-verifier-injection-closed]
  pull_request:
    branches: [main, deriv-eurusd-readonly-feed, level3-provenance-ops-readiness, feat/deriv-tls-claim-fail-closed, feat/public-rss-metadata-ingestion, feat/research-source-health-gaps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned test and market-data dependencies
        run: |
          python -m pip install "pip==26.3"
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Test Deriv read-only market-data collector
        run: python -m unittest discover -s tests -p 'test_deriv_feed.py' -v

      - name: Test durable paper research replay
        run: python -m unittest discover -s tests -p 'test_paper_replay.py' -v

      - name: Validate paper-mode startup
        run: python main.py --check

      - name: Check runtime report payload
        run: |
          python main.py --report > /tmp/jarvis-report.json
          python -c "import json; from pathlib import Path; p=json.loads(Path('/tmp/jarvis-report.json').read_text()); assert p['ok'] is True; assert p['mode']=='paper'; assert p['broker']=='paper'; print('report ok')"

      - name: Exercise deterministic paper session and ledger report
        run: |
          python scripts/paper_session.py --allow-entries --ledger /tmp/jarvis-paper-ledger.jsonl
          python scripts/paper_report.py /tmp/jarvis-paper-ledger.jsonl --min-days 1

      - name: Run 1,000-cycle paper durability stress test
        run: python scripts/paper_stress.py --cycles 1000

      - name: Run foundation diagnostic
        run: python scripts/diagnose.py

      - name: Build and smoke-test the local container
        run: |
          docker compose up -d --build --wait
          docker compose exec -T jarvis python -c "import json, urllib.request; base='http://127.0.0.1:8787'; assert json.loads(urllib.request.urlopen(base+'/health').read())['ok']; features=json.loads(urllib.request.urlopen(base+'/features').read()); assert features['read_only'] and features['execution_mode']=='paper_only'; dashboard=urllib.request.urlopen(base+'/dashboard'); assert dashboard.status==200 and dashboard.read(); print('container health, feature inventory, and dashboard ok')"

      - name: Stop the local container
        if: always()
        run: docker compose down
