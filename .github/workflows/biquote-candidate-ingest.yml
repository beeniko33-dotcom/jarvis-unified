name: Biquote candidate market-data ingest

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Collection duration in seconds (60–300)
        required: true
        default: "180"
        type: string

permissions:
  contents: read

concurrency:
  group: biquote-candidate-ingest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[market-data]"

      - name: Collect candidate-only EURUSD observations
        env:
          JARVIS_MARKET_DATA_URL: https://jarvis-control-worker.beeniko33.workers.dev/market-data
          JARVIS_COLLECTOR_TOKEN: ${{ secrets.JARVIS_COLLECTOR_TOKEN }}
        run: |
          if [ -z "$JARVIS_COLLECTOR_TOKEN" ]; then
            echo "::error::Repository Actions secret JARVIS_COLLECTOR_TOKEN is missing."
            exit 1
          fi
          duration="${{ inputs.duration_seconds }}"
          case "$duration" in
            ''|*[!0-9]*) echo "::error::duration_seconds must be numeric"; exit 1 ;;
          esac
          if [ "$duration" -lt 60 ] || [ "$duration" -gt 300 ]; then
            echo "::error::duration_seconds must be between 60 and 300"; exit 1
          fi
          python research/biquote_feed.py --duration-seconds "$duration" --db "$RUNNER_TEMP/biquote-eurusd.sqlite3" --max-quote-age-seconds 120
