name: Live Gate.io attestor verification

on:
  push:
    branches: [engineering/postgres-paper-cycle-orchestrator-2026-11-19]
    paths:
      - "research/paper_cycle_engine.py"
      - "scripts/verify_gateio_attestor_live.py"
      - "config/gateio-verifier-public-key.b64"
      - ".github/workflows/gateio-attestor-live-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/paper_cycle_engine.py"
      - "scripts/verify_gateio_attestor_live.py"
      - "config/gateio-verifier-public-key.b64"
      - ".github/workflows/gateio-attestor-live-check.yml"

permissions:
  contents: read

jobs:
  verify-live-public-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cryptographic verifier dependency
        run: python -m pip install "cryptography>=42,<47"
      - name: Fetch live Gate.io snapshot and verify Cloudflare Ed25519 signature
        run: python -m scripts.verify_gateio_attestor_live
