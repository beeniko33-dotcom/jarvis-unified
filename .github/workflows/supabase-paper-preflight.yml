name: Supabase paper-state connection preflight

on:
  workflow_dispatch:
  push:
    branches: [integration/supabase-paper-cycle-bridge]
    paths:
      - ".github/workflows/supabase-paper-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/supabase-paper-preflight.yml"
      - "research/supabase_paper_state.py"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: jarvis-supabase-paper-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only authenticated database preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JARVIS_DATABASE_URL: ${{ secrets.JARVIS_PAPER_PROTOTYPE_DATABASE_URL }}
      JARVIS_EXPECTED_DATABASE_HOST: db.uinibcemffkafdfuewyp.supabase.co
      PGCONNECT_TIMEOUT: "10"
      PGSSLMODE: require
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require configured secret without displaying it
        shell: bash
        run: |
          if [ -z "${JARVIS_DATABASE_URL:-}" ]; then
            echo "::error::JARVIS_PAPER_PROTOTYPE_DATABASE_URL is not configured for this workflow run."
            exit 1
          fi
          echo "Database secret is present (value withheld)."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"

      - name: Verify authenticated read-only access
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse
          import psycopg

          dsn = os.environ["JARVIS_DATABASE_URL"]
          expected_host = os.environ["JARVIS_EXPECTED_DATABASE_HOST"]
          parsed = urlparse(dsn)
          if parsed.scheme not in {"postgres", "postgresql"} or parsed.hostname != expected_host:
              print("Preflight refused: database URL does not target the isolated paper prototype.", file=sys.stderr)
              raise SystemExit(1)
          try:
              with psycopg.connect(dsn, connect_timeout=10, sslmode="require") as conn:
                  with conn.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")
                      cur.execute("""
                          SELECT current_database(),
                                 current_user,
                                 current_setting('transaction_read_only'),
                                 to_regclass('jarvis_private.paper_accounts') IS NOT NULL,
                                 to_regclass('jarvis_private.paper_runs') IS NOT NULL,
                                 to_regclass('jarvis_private.paper_ledger_events') IS NOT NULL
                      """)
                      db, role, read_only, accounts, runs, events = cur.fetchone()
                      if read_only != "on":
                          raise RuntimeError("Preflight transaction is not read-only.")
                      if not (accounts and runs and events):
                          raise RuntimeError("One or more required paper-state tables are missing.")
                      cur.execute("""
                          SELECT
                            (SELECT count(*) FROM jarvis_private.paper_accounts),
                            (SELECT count(*) FROM jarvis_private.paper_runs),
                            (SELECT count(*) FROM jarvis_private.paper_ledger_events)
                      """)
                      counts = cur.fetchone()
                      print(f"Connected database: {db}")
                      print(f"Authenticated database role: {role}")
                      print(f"Server transaction_read_only: {read_only}")
                      print("Required tables: present")
                      print("Row counts (accounts, runs, ledger events): " + ", ".join(map(str, counts)))
          except Exception as exc:
              # Deliberately omit exception text: drivers can include connection details.
              import re
              safe_message = str(exc).replace(dsn, "[REDACTED]")
              safe_message = re.sub(r"(?i)(password\s*=\s*)[^\s]+", r"\1[REDACTED]", safe_message)
              safe_message = re.sub(r"(://)[^/@\s]+@", r"\1[REDACTED]@", safe_message)
              print(f"Preflight failed: {type(exc).__name__}; detail={safe_message[:240]}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Confirm one-shot runner reads controls without market fetch or writes
        env:
          JARVIS_RUNNER_PREFLIGHT_ONLY: "1"
          JARVIS_EXPECTED_DATABASE_HOST: "db.uinibcemffkafdfuewyp.supabase.co"
          JARVIS_PAPER_ACCOUNT_ID: "preflight-only-no-write"
        run: |
          python -m pip install "cryptography==46.0.7"
          python -m scripts.run_paper_cycle_once > /tmp/jarvis-runner-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/jarvis-runner-preflight.json").read_text())
          assert result["status"] == "preflight_only"
          assert result["market_fetch_performed"] is False
          assert result["paper_state_write_performed"] is False
          assert result["orders_submitted"] == 0
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Confirm paper-only code path is present
        run: |
          python -c "from research.supabase_paper_state import SupabasePaperStateStore; print('Paper-state store import: OK')"
