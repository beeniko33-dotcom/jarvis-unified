name: Gate.io provider regression tests

on:
  push:
    branches: [feat/gateio-readonly-market-provider]
    paths:
      - "research/gateio_public_feed.py"
      - "scripts/gateio_public_smoke.py"
      - "tests/test_gateio_public_feed.py"
      - "tests/test_gateio_public_smoke.py"
      - ".github/workflows/gateio-provider-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/gateio_public_feed.py"
      - "scripts/gateio_public_smoke.py"
      - "tests/test_gateio_public_feed.py"
      - "tests/test_gateio_public_smoke.py"
      - ".github/workflows/gateio-provider-tests.yml"

permissions:
  contents: read

jobs:
  gateio-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Run Gate.io provider unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_gateio_public_*.py' -v
