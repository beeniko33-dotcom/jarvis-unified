[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-unified"
version = "0.2.0"
description = "Paper-first, broker-agnostic Jarvis trading platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "cryptography>=42,<47"]
market-data = ["websocket-client>=1.8,<2", "signalrcore>=1.0.4,<2"]
postgres = ["psycopg[binary]>=3.2,<4", "cryptography>=42,<47"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "brokers*", "core*", "infrastructure*", "packages*", "research*", "sources*"]
exclude = ["tests*"]
